name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.13

      # بيشغّل كل تستات الـ JVM (money/, util/, data/, sources/, domain/) قبل
      # أي بناء. لو أي تست فشل، الـ job يفشل هنا ومفيش APK بيتبنى أو يتـ upload —
      # القصد إن أي كسر في منطق مالي أو migration يتلقط جوه الـ PR نفسه، مش
      # بعد ما يوصل main.
      - name: Run unit tests
        run: gradle testPlayDebugUnitTest testDirectDebugUnitTest --no-daemon

      # بيترفع تقرير التستات كـ artifact حتى لو فشلوا، عشان تقدر تفتح الـ HTML
      # report وتشوف بالظبط أي تست فشل وليه من غير ما تشغّل الحاجة محليًا.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          # مع وجود flavors (play/direct) مفيش مجلد apk/debug/ خالص - الناتج
          # بيطلع في apk/play/debug/ و apk/direct/debug/، فالمسار القديم كان
          # بيرفع صفر ملفات من غير ما الـ job يفشل.
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
